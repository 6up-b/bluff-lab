<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Bluff Lab</title>
<link rel="icon" href="data:,">
<link rel="stylesheet" href="style.css">
</head>
<body>
<div id="viewport">
  <div id="stage">
    <div class="strip">
      <span class="mark">Bluff Lab</span>
      <span id="strip-scene"></span>
      <span class="where" id="strip-where"></span>
    </div>

    <section class="view" id="v-title"></section>
    <section class="view" id="v-table"></section>
    <section class="view" id="v-inspector"></section>
    <section class="view" id="v-dossier"></section>
    <section class="view" id="v-surgery"></section>
    <section class="view" id="v-ablation"></section>
    <section class="view" id="v-trust"></section>
    <section class="view" id="v-split"></section>
    <section class="view" id="v-results"></section>
    <section class="view" id="v-decisions"></section>
    <section class="view" id="v-stack"></section>
    <section class="view" id="v-forge"></section>
    <section class="view" id="v-longcon2"></section>
    <section class="view" id="v-branches"></section>
    <section class="view" id="v-boundary"></section>
    <section class="view" id="v-memory"></section>
    <section class="view" id="v-longcon3"></section>
    <section class="view" id="v-close"></section>

    <div class="caption" id="caption"></div>
  </div>
</div>
<div id="hud"></div>
<div id="touch-hint" aria-hidden="true"><span class="portrait-only">Rotate your phone for a bigger view · </span>Tap right to advance, left to go back</div>
<audio id="audio" preload="auto"></audio>
<script src="app.js"></script>
</body>
</html>
